name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Also allow manual trigger from GitHub website
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache Gradle to speed up future builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. Build the release APK (signed with debug key for sideloading)
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 6. Upload the APK as a downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealmeRemote-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 7. Also create a GitHub Release when you push a version tag
      # Usage: git tag v1.0 && git push origin v1.0
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          name: Realme IR Remote ${{ github.ref_name }}
          body: |
            ## Realme Smart TV IR Remote
            
            Download the APK below and install it on your Mi phone.
            
            **Requirements:** Phone must have IR blaster (Xiaomi/Redmi/POCO usually do)
            
            **Install:** Enable "Unknown sources" in settings, then open the APK.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
